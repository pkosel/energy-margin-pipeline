---
# The local hooks use `language: system`: the linters come from the Nix dev
# shell, so local and CI runs use identical versions and pre-commit installs
# no environments of its own.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]

      - id: sqlfluff
        name: sqlfluff lint
        entry: sqlfluff lint
        language: system
        types: [sql]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
