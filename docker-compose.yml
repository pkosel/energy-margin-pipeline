---
name: energy-margin-pipeline

# --------------------------------------------------------------------
# Shared Airflow service definition
#
# Every Airflow component runs the same image and configuration and
# differs only in its `command`. Anchors below are merged into each.
# --------------------------------------------------------------------
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # yamllint disable-line rule:line-length
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres-airflow/${AIRFLOW_DB_NAME:-airflow}
    # No default: a blank key starts fine and only fails later, when Airflow
    # tries to decrypt a connection.
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?set it in .env, see .env.example}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Task workers call back into the API server rather than the metadata DB.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    # Same reasoning: blank breaks task-to-apiserver auth at run time.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set it in .env, see .env.example}
    # Required for the scheduler healthcheck below.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # LocalExecutor runs tasks as subprocesses; capped to stay laptop-friendly.
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '4'
    DBT_PROFILES_DIR: /usr/app/dbt
    DBT_PROJECT_DIR: /usr/app/dbt
    # dbt resolves these itself via env_var() in profiles.yml.
    WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-energy}
    WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-energy}
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-energy}
    DBT_SCHEMA: ${DBT_SCHEMA:-analytics}
    DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./tests:/opt/airflow/tests
    # dbt project and profiles; edits apply without rebuilding the image.
    - ./dbt:/usr/app/dbt
  # Host UID keeps bind-mounted output writable; GID 0 is what the base image
  # grants its file permissions to.
  user: "${AIRFLOW_UID:-1000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy

services:
  # ------------------------------------------------------------------
  # Databases
  # ------------------------------------------------------------------

  # Airflow metadata only. Deliberately not published to the host so it
  # cannot be confused with the warehouse.
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER:-airflow}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Analytics warehouse: dbt's target, and reachable from the host for ad-hoc
  # queries.
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-energy}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-energy}
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:-energy}
    ports:
      - "${WAREHOUSE_DB_PORT:-5432}:5432"
    volumes:
      - warehouse-db:/var/lib/postgresql/data
      # Applied only while the data volume is empty; changes need `just nuke`.
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${WAREHOUSE_DB_USER:-energy}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ------------------------------------------------------------------
  # Airflow
  # ------------------------------------------------------------------

  # One-shot: prepares the bind mounts, migrates the metadata DB and creates
  # the admin user. Every other Airflow service waits for it to exit cleanly.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        chown -v -R "${AIRFLOW_UID:-1000}:0" /opt/airflow/{logs,dags,plugins,config}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    # Root, because it has to chown the mounts to AIRFLOW_UID.
    user: "0:0"

  # Web UI and the execution API the other components talk to.
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Schedules and, under LocalExecutor, also runs the tasks — which is why it
  # is the container `just dbt` and `just test` exec into.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      # Tasks hit the warehouse immediately, so wait for it here.
      warehouse:
        condition: service_healthy
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Parses the dags folder in a separate process; DAG changes only show up in
  # the UI once this has picked them up.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
  warehouse-db:
